<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PURF Draw Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --panel: #232325;
    --line: rgba(237, 237, 237, 0.14);
    --text: #ededed;
    --muted: #85858b;
    --accent: #7fa7ee;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text);
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 4px 8px; }
  .stage { position: relative; width: min(100%, var(--size)); aspect-ratio: 1 / 1; border-radius: 14px; padding: 1px;
    background: var(--line); }
  .inner { position: relative; width: 100%; height: 100%; border-radius: 13px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #data { visibility: hidden; }
  .hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; color: var(--muted); font-size: 14px; transition: opacity .2s var(--ease); gap: 8px; }
  .hint b { font-family: 'IBM Plex Mono', monospace; font-size: 64px; font-weight: 400; color: rgba(237, 237, 237, 0.14); }
  .cursor { position: absolute; pointer-events: none; border-radius: 50%; border: 1px solid rgba(237, 237, 237, .6);
    transform: translate(-50%, -50%); opacity: 0; transition: opacity .15s var(--ease); }
  .toolbar { width: min(100%, var(--size)); display: flex; gap: 8px; align-items: stretch; }
  .toolbar .slider { flex: 1; min-width: 0; }
  .toolbar input[type=range] { flex: 1; width: auto; min-width: 60px; }
  .btn.icon { padding: 8px 12px; }
  .btn.wide { width: min(100%, var(--size)); justify-content: center; padding: 12px 20px; font-size: 15px; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 12px;
    border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 8px;
    align-items: center; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
  .btn:hover:not(:disabled) { border-color: rgba(237, 237, 237, .28); background: #2a2a2d; }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--text); border-color: var(--text); color: #141415; }
  .btn.primary:hover:not(:disabled) { background: #ffffff; border-color: #ffffff; }
  .slider { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); font-size: 13px; color: var(--muted); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 110px; height: 4px; border-radius: 2px;
    background: rgba(237, 237, 237, 0.2); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: none; cursor: pointer; }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .val { min-width: 24px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .kbd { font-size: 12px; color: var(--muted); text-align: center; }
  .kbd span { font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; margin: 0 2px; }
  svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="inner" id="inner">
      <canvas id="view"></canvas>
      <canvas id="data"></canvas>
      <div class="hint" id="hint"><b>0–9</b>Draw one digit here</div>
      <div class="cursor" id="cursor"></div>
    </div>
  </div>
  <div class="toolbar">
    <div class="slider" title="Brush thickness">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
      <input id="brush" type="range" min="6" max="48" step="1" /> <span class="val" id="brushVal"></span>
    </div>
    <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
    <button class="btn icon" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
    <button class="btn" id="clear" title="Clear (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Clear</button>
  </div>
  <button class="btn primary wide" id="predict" title="Predict (Enter)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>Predict digit</button>
  <div class="kbd"><span>Enter</span> predict · <span>Ctrl+Z</span> undo · <span>Esc</span> clear</div>
</div>

<script>
(function () {
  "use strict";
  const RES = 336;                         // internal resolution of the drawing (square)
  const view = document.getElementById("view");
  const data = document.getElementById("data");
  const vctx = view.getContext("2d");
  const dctx = data.getContext("2d", { willReadFrequently: false });
  const hint = document.getElementById("hint");
  const cursor = document.getElementById("cursor");
  const brushInput = document.getElementById("brush");
  const brushVal = document.getElementById("brushVal");
  const btn = { undo: undo, redo: redo, clear: clear, predict: predict };
  Object.keys(btn).forEach(id => document.getElementById(id).addEventListener("click", btn[id]));

  let args = { brush: 22, live: true, size: 380 };
  let strokes = [], redoStack = [], current = null, drawing = false, nonce = 0, ready = false;

  // ---- Streamlit component protocol (no build step required) -----------
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function setHeight() { send("streamlit:setFrameHeight", { height: document.getElementById("wrap").scrollHeight + 8 }); }
  function setValue(action) {
    nonce += 1;
    const empty = strokes.length === 0;
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { action: action, nonce: nonce, empty: empty, strokes: strokes.length,
               image: empty ? null : data.toDataURL("image/png") }
    });
  }
  window.addEventListener("message", function (event) {
    const msg = event.data;
    if (!msg || msg.type !== "streamlit:render") return;
    const a = msg.args || {};
    const first = !ready;
    args = Object.assign(args, a);
    document.documentElement.style.setProperty("--size", (args.size || 380) + "px");
    if (first) { brushInput.value = args.brush; brushVal.textContent = args.brush; ready = true; }
    setHeight();
  });

  // ---- Canvas setup --------------------------------------------------------
  [view, data].forEach(c => { c.width = RES; c.height = RES; });
  function resetCanvas(ctx) { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, RES, RES); }

  function drawGuides() {
    vctx.save();
    vctx.strokeStyle = "rgba(237,237,237,0.06)";
    vctx.lineWidth = 1;
    for (let i = 1; i < 8; i++) {
      const p = (RES / 8) * i;
      vctx.beginPath(); vctx.moveTo(p, 0); vctx.lineTo(p, RES); vctx.stroke();
      vctx.beginPath(); vctx.moveTo(0, p); vctx.lineTo(RES, p); vctx.stroke();
    }
    vctx.setLineDash([6, 8]);
    vctx.strokeStyle = "rgba(237,237,237,0.16)";
    const m = RES * 0.14;
    vctx.strokeRect(m, m, RES - 2 * m, RES - 2 * m);
    vctx.restore();
  }

  function strokePath(ctx, s) {
    const pts = s.points;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = s.width;
    ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff";
    if (pts.length === 1) {
      ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, s.width / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {          // quadratic smoothing through midpoints
        const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      const last = pts[pts.length - 1];
      ctx.lineTo(last.x, last.y); ctx.stroke();
    }
    ctx.restore();
  }

  function redraw() {
    resetCanvas(vctx); drawGuides(); resetCanvas(dctx);
    const all = current ? strokes.concat([current]) : strokes;
    all.forEach(s => { strokePath(vctx, s); strokePath(dctx, s); });
    hint.style.opacity = all.length ? 0 : 1;
    document.getElementById("undo").disabled = strokes.length === 0;
    document.getElementById("redo").disabled = redoStack.length === 0;
    document.getElementById("clear").disabled = strokes.length === 0;
    document.getElementById("predict").disabled = strokes.length === 0;
  }

  function toCanvas(e) {
    const r = view.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (RES / r.width), y: (e.clientY - r.top) * (RES / r.height) };
  }
  function moveCursor(e) {
    const r = view.getBoundingClientRect();
    const px = (e.clientX - r.left), py = (e.clientY - r.top);
    const d = Number(brushInput.value) * (r.width / RES);
    Object.assign(cursor.style, { left: px + "px", top: py + "px", width: d + "px", height: d + "px", opacity: 1 });
  }

  view.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    drawing = true;
    current = { width: Number(brushInput.value), points: [toCanvas(e)] };
    redoStack = [];
    redraw();
  });
  view.addEventListener("pointermove", function (e) {
    moveCursor(e);
    if (!drawing || !current) return;
    const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evts.forEach(ev => current.points.push(toCanvas(ev)));
    redraw();
  });
  function endStroke() {
    if (!drawing) return;
    drawing = false;
    if (current && current.points.length) strokes.push(current);
    current = null;
    redraw();
    if (args.live) setValue("stroke");
  }
  view.addEventListener("pointerup", endStroke);
  view.addEventListener("pointercancel", endStroke);
  view.addEventListener("pointerleave", function () { cursor.style.opacity = 0; });

  function undo() { if (!strokes.length) return; redoStack.push(strokes.pop()); redraw(); setValue(args.live ? "stroke" : "undo"); }
  function redo() { if (!redoStack.length) return; strokes.push(redoStack.pop()); redraw(); setValue(args.live ? "stroke" : "redo"); }
  function clear() { strokes = []; redoStack = []; current = null; redraw(); setValue("clear"); }
  function predict() { if (!strokes.length) return; setValue("predict"); }

  brushInput.addEventListener("input", function () { brushVal.textContent = brushInput.value; });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
    else if (e.key === "Enter") { e.preventDefault(); predict(); }
    else if (e.key === "Escape" || e.key === "Delete") { e.preventDefault(); clear(); }
  });

  // Testing hook: lets automated tests draw strokes programmatically.
  window.purfDraw = function (list, width) {
    list.forEach(pts => strokes.push({ width: width || Number(brushInput.value), points: pts.map(p => ({ x: p[0], y: p[1] })) }));
    redraw(); if (args.live) setValue("stroke");
  };

  redraw();
  window.addEventListener("resize", setHeight);
  if (window.ResizeObserver) new ResizeObserver(setHeight).observe(document.getElementById("wrap"));
  send("streamlit:componentReady", { apiVersion: 1 });
  setTimeout(setHeight, 50);
})();
</script>
</body>
</html>
